<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX SURVIVOR</title>
    <!-- Imports the standard arcade Press Start 2P font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 40px 0;
            color: #ffffff;
            text-shadow: 4px 4px #ff0000;
            letter-spacing: 2px;
        }
        p {
            font-size: 0.8rem;
            line-height: 2;
            margin: 20px 0;
            color: #aaaaaa;
        }
        .blink {
            animation: blinker 1.5s linear infinite;
            color: #ffffff;
            margin-top: 50px;
            font-size: 0.9rem;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HEX SURVIVOR</h1>
        <p>SYSTEM UPDATE IN PROGRESS</p>
        <p>DEPLOYING 45MB HEAVY BUILD TONIGHT</p>
        <div class="blink">INSERT COIN TO RESTART</div>
    </div>
</body>
</html>
